[platformio]
# Cay co ten "motor_test" hien la firmware production: no co SPEED_REFERENCE
# 25, PWM_MAX 140, telemetry SEQ va gyro dang chay tren xe. Tro ro o day de
# Build/Upload tu workspace goc khong vo tinh dung cay firmware V2 cu.
src_dir = motor_test_bts7960/src

[env:nucleo_f411re]
platform = ststm32
board = nucleo_f411re
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit BNO055 @ ^1.6.4
